# Environment for Code/frugal/demo (the offline Frugal AI talk demo). Create it FROM THIS FOLDER:
#   conda env create -f environment.yml && conda activate frugalai-demo
# Versions are those installed in the author's env genai (Python 3.10.19), read on 2026-11-14.
# That env has not been rebuilt from this file yet, so treat it as unverified until someone does.
# The page imports quantum-wiki, workflow-agent, finetune-slm and common from the FrugalAI repo (demo_lib.py puts
# them on the path): clone FrugalAI next to this repo, or set FRUGALAI_REPO to its folder.
# docling is left out: only quantum-wiki's parse step needs it, and the parsed files are already in that repo.
# Needs LM Studio serving Qwen3 1.7B and nomic-embed (see the README).
name: frugalai-demo
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytest=9.0.2
  - numpy=1.26.4
  - requests=2.32.5
  - psutil=5.9.5
  - scikit-learn=1.7.2
  - pip:
      - langchain-core==1.6.10
      - langchain-openai==1.1.6
      - pydantic==2.12.5
      - langgraph==1.0.4
      - langchain-community==0.4.1
      - langchain-text-splitters==1.1.0
      - pymupdf==1.27.2.3
      - streamlit==1.60.0
      - websocket-client==1.6.1
      - matplotlib==3.10.8
