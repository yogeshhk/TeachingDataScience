name: llamaindex
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - llama-index
    - llama-index-llms-groq
    - llama-index-embeddings-huggingface
    - llama-parse
    - chromadb
    - sqlalchemy
    - nest-asyncio
    - tavily-python
    - python-dotenv
    - pandas
    - jupyter
# Usage:
#   conda env create -f environment.yml
#   conda activate llamaindex
#   Keys (LlamaCloud, Tavily, an LLM provider) go in a .env file; see README.md
