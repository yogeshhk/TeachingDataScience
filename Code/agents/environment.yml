name: agents
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - langchain>=0.2.0
    - langchain-community>=0.2.0
    - langchain-openai>=0.1.0
    - langchain-google-vertexai>=1.0.0
    - pyautogen>=0.2.0
    - openai
    - groq
    - streamlit
    - python-dotenv
    - jupyter
# Usage:
#   conda env create -f environment.yml
