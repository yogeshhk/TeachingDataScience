name: pytorch
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch
    - torchvision
    - torch-geometric
    - scikit-learn
    - numpy
    - pandas
    - matplotlib
    - networkx
    - pillow
    - jupyter
# Usage:
#   conda env create -f environment.yml
#   conda activate pytorch
# This installs the CPU build from PyPI. For a GPU build, follow https://pytorch.org/get-started/locally/
