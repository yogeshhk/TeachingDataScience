name: crewai-scripts
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - crewai>=0.30.0
    - langchain>=0.2.0
    - openai
    - groq
    - python-dotenv
# Usage:
#   conda env create -f environment.yml
#   conda activate crewai-scripts
#
# Note: researcher/ is a separate uv-managed project (pyproject.toml + uv.lock),
#       not covered by this env — see its own README.
