name: dlcoep
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.0
  - scikit-learn>=1.3     # the offline digits fallback in session01_cnn
  - matplotlib>=3.7
  - pytorch>=2.2          # the numbers on the slides were produced with 2.7.1
  - torchvision>=0.17     # MNIST download (about 11 MB, once, into Code/dlcoep/data)
  - jupyterlab

# To create:   conda env create -f environment.yml
# To activate: conda activate dlcoep
