name: docling
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - docling
    - langchain
    - langchain-community
    - langchain-core
    - langchain-text-splitters
    - langchain-huggingface
    - langchain-chroma
    - langchain-openai
    - llama-index
    - chromadb
    - faiss-cpu
    - streamlit
    - python-dotenv
    - pandas
    - jupyter
# Usage:
#   conda env create -f environment.yml
#   conda activate docling
# The parsing step downloads layout and table models on first use. The Milvus examples also need
# langchain-milvus; see README.md.
